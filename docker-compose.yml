# yamllint disable rule:line-length
---
services:
  main:
    build: .
    depends_on:
      seedtimescaledb:
        condition: service_completed_successfully
    ports:
      - "8081:8081"
    volumes:
      - /var/run/dbus:/var/run/dbus
    privileged: true
    environment:
      TIMESCALE_CONN_STRING: "postgres://postgres:example@timescaledb:5432/postgres?sslmode=disable"

      # Map your own battery IDs to device addresses. The ID is what gets stored
      # with every reading, so pick something meaningful and stable.
      # Run `go run ./example/multi` from go-litime-bluetooth to list addresses.
      # A value that is not an address is treated as an advertised name instead.
      LITIME_BATTERIES: "garage=11:22:33:AA:BB:CC,shed=11:22:33:AA:BB:CD"

      OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo:4317"

      # grpc (otlp tracing)
      GRPC_GO_LOG_VERBOSITY_LEVEL: 99
      GRPC_GO_LOG_SEVERITY_LEVEL: info

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  tempo:
    image: grafana/tempo:latest
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./docker/tempo/tempo.yml:/etc/tempo.yaml
      - /tmp/tempo-data:/tmp/tempo
    ports:
      - "4317:4317" #  otlp grpc
      - "4318:4318" #  otlp http

  grafana:
    image: grafana/grafana
    volumes:
      - ./docker/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml
      - ./docker/grafana/dashboard.yaml:/etc/grafana/provisioning/dashboards/main.yaml
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    ports:
      - "3000:3000"

  timescaledb:
    # Pinned to the version the live database runs, so a schema that works here
    # is a schema that works there.
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_PASSWORD: example
      # timescaledb-tune reads the cgroup memory limit at startup and panics
      # where that is unreadable. Nothing here needs tuning.
      NO_TS_TUNE: "true"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 5

  # The schema is defined in lfprocks/timescale-migrations, which is what
  # actually migrates the live database. This stack used to carry its own copy
  # of the sensors.litime and sensors.victron migrations; two files describing
  # one table is how they end up disagreeing.
  seedtimescaledb:
    image: ghcr.io/lfprocks/timescale-migrations:latest
    environment:
      DATABASE_HOST: timescaledb
      DATABASE_USER: postgres
      DATABASE_PASSWORD: example
      DATABASE_NAME: postgres
    depends_on:
      timescaledb:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "8082:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: password
    volumes:
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json
